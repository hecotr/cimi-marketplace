spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true

# 禁用安全配置
  security:
    user:
      name: test
      password: test

# 对象存储配置 (测试环境禁用)
object-storage:
  type: none

logging:
  level:
    com.aimarketplace: DEBUG
