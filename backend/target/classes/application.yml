server:
  port: 8080

spring:
  application:
    name: ai-marketplace

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:10.254.254.103}:${DB_PORT:5432}/${DB_NAME:ai-marketplace}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # 禁用 Spring Security 默认登录页
  security:
    user:
      name: unused
      password: unused

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

storage:
  type: minio  # minio or s3
  minio:
    endpoint: ${MINIO_ENDPOINT:http://10.254.254.103:9001}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:ai-marketplace}
  s3:
    endpoint: ${S3_ENDPOINT:}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    bucket: ${S3_BUCKET:}
    region: ${S3_REGION:}
